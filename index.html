<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện | Trang chủ</title>
    <link rel="icon" type="image/png" href="./img/logo/logo-favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- <link rel="stylesheet" href="../css/style.min.css"> -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/custom.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/utility.css">
    <link rel="stylesheet" href="./css/swiper-custom.css">
    <link rel="stylesheet" href="./css/effect-web.css">
</head>

<body>
    <header class="header-section flex-col bg-white" data-include="./component/header.html"></header>
    <main>
        <section class=" container-padding flex-col gap-30">
            <div class="filter-section container-xl flex flex-col gap-20 item-padding-20-0">

                <div
                    class="filter-top-bar bg-light-purple border-radius-10 item-padding-10-20 flex jus-sb align-center flex-wrap gap-20">

                    <div class="filter-left flex flex-wrap gap-10">
                        <div class="filter-select__container border-radius-10 item-padding-5-10 bg-white ">
                            <select class="filter-select border-none outline-none bg-white text-sm cursor-pointer">
                                <option value="" selected disabled hidden>Ngành nghề</option>
                                <option value="cafe">Quán Cafe & Trà sữa</option>
                                <option value="restaurant">Nhà hàng & Quán ăn</option>
                                <option value="hotel">Khách sạn & Resort</option>
                                <option value="real-estate">Bất động sản</option>
                            </select>
                        </div>
                        <div class="filter-select__container border-radius-10 item-padding-5-10 bg-white ">
                            <select class="filter-select border-none outline-none bg-white text-sm cursor-pointer">
                                <option value="" selected disabled hidden>Mô hình Layout</option>
                                <option value="ecommerce">E-Commerce (Bán hàng)</option>
                                <option value="landing">Landing Page</option>
                                <option value="dashboard">Admin Dashboard</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="product-display-container" data-include="./component/gridproduct.html"></div>
            <div class="pagination-wrapper flex center-hor gap-5 item-padding-40-20">
                <a href="javascript:void(0)"
                    class=" pagination-btn flex center-hor center-ver border-radius-5 custom-item__low text-sm hover-border-primary">&lt;</a>
                <a href="javascript:void(0)"
                    class=" pagination-btn active flex center-hor center-ver border-radius-5 custom-item__low text-sm hover-border-primary">1</a>
                <a href="javascript:void(0)"
                    class=" pagination-btn flex center-hor center-ver border-radius-5 custom-item__low text-sm hover-border-primary">2</a>
                <a href="javascript:void(0)"
                    class=" pagination-btn flex center-hor center-ver border-radius-5 custom-item__low text-sm hover-border-primary">3</a>
                <a href="javascript:void(0)"
                    class=" pagination-btn flex center-hor center-ver border-radius-5 custom-item__low text-sm hover-border-primary">&gt;</a>
            </div>
        </section>
    </main>
    <footer class=" bg-light-blue flex-col item-padding-80-0 gap-30" data-include="./component/footer.html">
    </footer>
    <div class="btntotop__container pos-fixed bg-white" data-include="./component/rolltotop.html" id="btnToTop">
    </div>
    <script defer type="text/javascript" src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script defer type="text/javascript" src="./js/frontend.js"></script>
</body>

</html>
