<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện | Chi tiết tin tức</title>
    <link rel="icon" type="image/png" href="./img/logo/logo-favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="./img/banner/banner-home.webp">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <!-- <link rel="stylesheet" href="../css/style.min.css"> -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/custom.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/utility.css">
    <link rel="stylesheet" href="./css/swiper-custom.css">

</head>

<body>
    <header class=" bg-black " data-include="./component/header.html"></header>
    <main class=" flex flex-col center-hor pos-rel">
        <section class="bg-gray ">
            <div class="container-xl nav-bar__container">
                <a href="./index.html" class="nav-bar__item">Trang chủ</a>
                <a href="javascript:void(0)" class="nav-bar__item">Sản phẩm</a>
            </div>
        </section>
        <section class="page-layout item-padding-20 flex align-start gap-20">
            <div class="layout-sidebar flex flex-col gap-10">
                <p class="filter-widget__title bold text-md">Danh mục</p>
                <ul class="filter-widget__list flex flex-col gap-10">
                    <li class="filter-item flex align-center gap-10 cursor-pointer">
                        <input type="checkbox" id="cat-all" checked>
                        <label for="cat-all" class="text-sm cursor-pointer">Tất cả Layouts</label>
                    </li>
                    <li class="filter-item flex align-center gap-10 cursor-pointer">
                        <input type="checkbox" id="cat-landing">
                        <label for="cat-landing" class="text-sm cursor-pointer">Landing Pages</label>
                    </li>
                    <li class="filter-item flex align-center gap-10 cursor-pointer">
                        <input type="checkbox" id="cat-ecom">
                        <label for="cat-ecom" class="text-sm cursor-pointer">E-commerce</label>
                    </li>
                    <li class="filter-item flex align-center gap-10 cursor-pointer">
                        <input type="checkbox" id="cat-dash">
                        <label for="cat-dash" class="text-sm cursor-pointer">Dashboards</label>
                    </li>
                </ul>
                <p class="filter-widget__title bold text-md">Công nghệ</p>
                <ul class="filter-widget__list flex flex-col gap-10 product-card__info">
                    <li class="filter-item flex align-center gap-10 cursor-pointer">
                        <input type="checkbox" id="tech-react" checked>
                        <label for="tech-react" class="text-sm cursor-pointer">React</label>
                    </li>
                    <li class="filter-item flex align-center gap-10 cursor-pointer">
                        <input type="checkbox" id="tech-vue">
                        <label for="tech-vue" class="text-sm cursor-pointer">Vue</label>
                    </li>
                    <li class="filter-item flex align-center gap-10 cursor-pointer">
                        <input type="checkbox" id="tech-wp">
                        <label for="tech-wp" class="text-sm cursor-pointer">WordPress</label>
                    </li>
                    <li class="filter-item flex align-center gap-10 cursor-pointer">
                        <input type="checkbox" id="tech-html">
                        <label for="tech-html" class="text-sm cursor-pointer">HTML/CSS</label>
                    </li>
                </ul>
                <div class="mobile-filter flex-col gap-10 ">

                    <label for="mobile-filter-select" class="mobile-filter__title bold text-md">Bộ lọc tìm kiếm</label>

                    <div class="item-padding-10 mobile-filter__content custom-item">
                        <select id="mobile-filter-select" class="mobile-filter__select  cursor-pointer bg-white">
                            <optgroup label="--- Danh mục ---">
                                <option value="cat-all" selected>Tất cả Layouts</option>
                                <option value="cat-landing">Landing Pages</option>
                                <option value="cat-ecommerce">E-commerce</option>
                                <option value="cat-dashboard">Dashboards</option>
                            </optgroup>

                            <optgroup label="--- Công nghệ ---">
                                <option value="tech-react">React</option>
                                <option value="tech-vue">Vue</option>
                                <option value="tech-wordpress">WordPress</option>
                                <option value="tech-html">HTML/CSS</option>
                            </optgroup>

                        </select>
                    </div>
                </div>
            </div>

            <div class="layout-content flex flex-col gap-20">

                <div class="content-top flex jus-sb align-center">
                    <div class="text-header-size bold">Layouts Nổi Bật</div>
                    <div class="sort-dropdown flex align-center gap-10">
                        <p class="text-sm un-wrap text-color-deactive">Sắp xếp:</p>
                        <select
                            class="border-primary border-radius-5 item-padding-5-10 text-sm cursor-pointer border-none">
                            <option>Mới nhất</option>
                            <option>Bán chạy</option>
                        </select>
                    </div>
                </div>

                <div class="product-display-container">

                    <div class="product-display-container" data-include="./component/gridproduct.html"></div>
                </div>
                <div class="pagination-wrapper flex center-hor gap-5 item-padding-40-20">
                    <a href="javascript:void(0)"
                        class=" pagination-btn flex center-hor center-ver border-radius-5 custom-item__low text-sm hover-border-primary">&lt;</a>
                    <a href="javascript:void(0)"
                        class=" pagination-btn active flex center-hor center-ver border-radius-5 custom-item__low text-sm hover-border-primary">1</a>
                    <a href="javascript:void(0)"
                        class=" pagination-btn flex center-hor center-ver border-radius-5 custom-item__low text-sm hover-border-primary">2</a>
                    <a href="javascript:void(0)"
                        class=" pagination-btn flex center-hor center-ver border-radius-5 custom-item__low text-sm hover-border-primary">3</a>
                    <a href="javascript:void(0)"
                        class=" pagination-btn flex center-hor center-ver border-radius-5 custom-item__low text-sm hover-border-primary">&gt;</a>
                </div>

            </div>
        </section>
    </main>
    <footer class=" bg-light-blue center-ver flex flex-col item-padding-80-0 gap-30"
        data-include="./component/footer.html"></footer>
    <div class="btntotop__container pos-fixed bg-white" data-include="./component/rolltotop.html" id="btnToTop">
    </div>
    <script defer type="text/javascript" src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
    <script defer type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script defer type="text/javascript" src="./js/frontend.js"></script>
</body>

</html>
